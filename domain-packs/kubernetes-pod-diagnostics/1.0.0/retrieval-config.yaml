keyword_top_k: 20
vector_top_k: 20
final_top_k: 6
vector_policy: required
embedding_query_instruction: Given a Kubernetes Pod operational symptom, retrieve authoritative documentation useful for diagnosing its cause.
query_intents:
  - type: CAUSE_CANDIDATES
    template: "{title} {description} {predicate_labels} 可能原因"
  - type: EXPECTED_EVIDENCE
    template: "{title} {description} {predicate_labels} 原因成立时应出现哪些迹象"
  - type: INVESTIGATION_ACTIONS
    template: "{title} {description} {predicate_labels} 下一步检查什么"
fusion:
  type: rrf
  k: 60
weights:
  applicability: 1.25
source_diversity:
  max_units_per_document: 2
minimum_score: 0.01
