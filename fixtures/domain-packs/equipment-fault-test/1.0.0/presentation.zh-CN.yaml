locale: zh-CN
name: 设备故障测试包
description: 仅用于验证通用领域引擎，不用于生产判断。
event_types:
  equipment_fault:
    label: 设备故障
    subject_type: equipment_asset
    subject_label: 设备资产
    fields:
      asset_id: {label: 资产编号, control: text, placeholder: pump-001}
      site: {label: 所在站点, control: text, placeholder: workshop-a}
    evidence_inputs:
      observation_bundle: {label: 上传 Observation Bundle, help: 导入结构化设备观测并逐项复核。}
      text: {label: 添加设备现象}
      file: {label: 上传设备记录}
hypotheses:
  overheating: {title: 设备过热, description: 温度超过正常运行范围。}
  mechanical_imbalance: {title: 机械不平衡, description: 旋转部件不平衡导致异常振动。}
predicates:
  temperature_high: 温度超过正常范围
  vibration_level: 振动强度
  reported_issue: 人工报告的设备现象
