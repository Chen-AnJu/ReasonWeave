keyword_top_k: 20
vector_top_k: 20
final_top_k: 6
vector_policy: optional
embedding_query_instruction: Retrieve synthetic equipment diagnostic knowledge for a test investigation.
query_intents:
  - {type: CAUSE_CANDIDATES, template: "{title} {description} {predicate_labels} 可能原因"}
  - {type: EXPECTED_EVIDENCE, template: "{title} {predicate_labels} 预期证据"}
  - {type: INVESTIGATION_ACTIONS, template: "{title} {predicate_labels} 下一步检查"}
fusion: {type: rrf, k: 60}
weights: {applicability: 1.25}
source_diversity: {max_units_per_document: 2}
minimum_score: 0.01
