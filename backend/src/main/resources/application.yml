spring:
  application:
    name: reasonweave
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/reasonweave}
    username: ${SPRING_DATASOURCE_USERNAME:reasonweave}
    password: ${SPRING_DATASOURCE_PASSWORD:reasonweave}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 24MB

server:
  port: 8080
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs

rw:
  instance-name: ${RW_INSTANCE_NAME:ReasonWeave}
  seed-fixtures: ${RW_SEED_FIXTURES:false}
  blob-root: ${RW_BLOB_ROOT:./data/blob}
  domain-pack-roots: ${RW_DOMAIN_PACK_ROOTS:../domain-packs}
  fixture-root: ${RW_FIXTURE_ROOT:../fixtures}
  cors-allowed-origins: ${RW_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  vision:
    provider: ${RW_VISION_PROVIDER:mock}
    base-url: ${RW_VISION_BASE_URL:https://api.example.invalid/v1}
    chat-path: ${RW_VISION_CHAT_PATH:/chat/completions}
    model: ${RW_VISION_MODEL:mock-vision-v1}
    api-key: ${VISION_API_KEY:}
  embedding:
    provider: ${RW_EMBEDDING_PROVIDER:mock}
    base-url: ${RW_EMBEDDING_BASE_URL:http://localhost:11434}
    path: ${RW_EMBEDDING_PATH:/api/embed}
    model: ${RW_EMBEDDING_MODEL:qwen3-embedding:0.6b}
    dimension: ${RW_EMBEDDING_DIMENSION:1024}
    model-digest: ${RW_EMBEDDING_MODEL_DIGEST:unverified}
    query-instruction: ${RW_EMBEDDING_QUERY_INSTRUCTION:为当前领域事件检索权威且可追溯的知识：}
    api-key: ${EMBEDDING_API_KEY:}
